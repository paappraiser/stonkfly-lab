[project]
name = "stonkfly-lab"
version = "0.1.0"
description = "Fly-style mushroom-body trading lab with odor codes, delayed dopamine, two-fly agreement, and a live dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matt Z" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
flylab = "flylab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flylab*"]

[tool.setuptools.package-data]
flylab = ["web/*"]
